  <div class="body">
    <div class="main">
      <input type="checkbox" id="chk" aria-hidden="true">
      <div class="signup" [style.backgroundImage]="'url(' + imageUrl + ')'"></div>
      <div class="reset-password">
        <form (ngSubmit)="submit()">
          <label for="chk" aria-hidden="true">Réinitialiser mot de passe</label><br>
          <p class="label">Veuillez saisir votre adresse e-mail de réinitialisation </p>
         
          <input type="email" [(ngModel)]="email" name="email" placeholder="Adresse e-mail" required/>
          
          <button type="submit">Réinitialiser</button>
          <br>
          <br>
          <p class="message">Retour à <a style="color: #DBAF48;" routerLink="/login">Connexion</a></p>
        </form>
      </div>
    </div>

  </div>
</div>

  <div class="alert alert-danger my-3" role="alert" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>
  
  <div class="alert alert-success my-3" role="alert" *ngIf="SuccessMessage">
    {{ SuccessMessage }}
  </div>
